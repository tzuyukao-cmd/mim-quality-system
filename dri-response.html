<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>特採簽核 - MIM品質系統</title>
<style>
  .evidence-img{display:block;max-width:100%;max-height:360px;border:1px solid #ddd;border-radius:6px;margin-top:6px;cursor:zoom-in;}
  body{font-family:"Microsoft JhengHei",sans-serif;background:#f4f5f7;margin:0;padding:20px;color:#222;}
  .card{max-width:520px;margin:0 auto;background:#fff;border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,.08);padding:24px;}
  h1{font-size:20px;margin:0 0 4px;}
  .ticket-no{font-family:monospace;font-size:15px;color:#555;margin-bottom:16px;}
  .facts{width:100%;border-collapse:collapse;margin-bottom:16px;}
  .facts td{padding:6px 4px;border-bottom:1px solid #eee;font-size:14px;}
  .facts td:first-child{color:#888;width:90px;}
  label{display:block;font-size:13px;color:#555;margin:12px 0 4px;font-weight:600;}
  select,input[type=text],input[type=password],input[type=number],textarea{width:100%;box-sizing:border-box;padding:8px;border:1px solid #ccc;border-radius:6px;font-size:14px;}
  textarea{min-height:60px;resize:vertical;}
  .choice-row{display:flex;gap:8px;margin-top:6px;}
  .choice-btn{flex:1;padding:10px;border:1.5px solid #ccc;border-radius:6px;background:#fff;cursor:pointer;font-weight:700;font-size:14px;}
  .choice-btn.sel{border-color:#2563eb;background:#eff6ff;color:#2563eb;}
  .release-condition{display:none;margin-top:8px;}
  .release-condition.show{display:block;}
  .submit-btn{margin-top:18px;width:100%;padding:12px;background:#2563eb;color:#fff;border:none;border-radius:6px;font-size:15px;font-weight:700;cursor:pointer;}
  .submit-btn:disabled{background:#aaa;cursor:not-allowed;}
  .msg{margin-top:12px;padding:10px;border-radius:6px;font-size:13px;display:none;}
  .msg.err{background:#fdecea;color:#c0392b;display:block;}
  .msg.ok{background:#e6f6ec;color:#1e7e34;display:block;}
  .readonly-box{background:#f8f9fa;border-radius:6px;padding:14px;font-size:14px;line-height:1.6;}
  .loading{text-align:center;color:#888;padding:30px 0;}
</style>
</head>
<body>
<div class="card" id="app">
  <div class="loading">讀取中…</div>
</div>

<script>
// ★ 部署dri_response_backend.gs後，把Web App網址貼在這裡
const API_URL = 'https://script.google.com/macros/s/AKfycbxWZB8U3HaU7m9TZsQ85PzRCvFJf8zIt3dd8WppQdu6XuPLwcKku-bCIzbE4v7qVP3Z/exec';

const params = new URLSearchParams(location.search);
const ticketNo = params.get('ticket');
const app = document.getElementById('app');

// ★ 2026-10-06新增：Google偶發回傳「很抱歉，目前無法開啟這個檔案」的HTML錯誤頁(非JSON)，
//   原本直接顯示「Unexpected token '<'」看不懂。讀取類自動重試2次；寫入類不重試(避免重複送出)，
//   改顯示看得懂的提示，請使用者重新整理確認狀態。
const BUSY_READ_MSG = '系統暫時忙碌，請稍後重新整理頁面再試一次。';
async function parseJsonOrBusy(res, writeMsg){
  const text = await res.text();
  try { return JSON.parse(text); }
  catch(e){ const err = new Error(writeMsg || BUSY_READ_MSG); err.friendly = true; throw err; }
}
async function fetchJsonRetry(url){
  for(let i = 0; ; i++){
    try { return await parseJsonOrBusy(await fetch(url)); }
    catch(err){ if(!err.friendly || i >= 2) throw err; await new Promise(r => setTimeout(r, 1500)); }
  }
}
async function apiGet(action, extra){
  const qs = new URLSearchParams(Object.assign({action}, extra||{}));
  return fetchJsonRetry(API_URL + '?' + qs.toString());
}
async function apiPost(action, payload){
  const res = await fetch(API_URL, {
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify({action, payload})
  });
  return parseJsonOrBusy(res, '系統暫時忙碌，資料可能已經送出。請重新整理頁面確認目前狀態，不要重複送出。');
}

function readFileAsBase64(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>{
      const dataUrl = reader.result; // "data:<mime>;base64,<data>"
      const base64 = dataUrl.slice(dataUrl.indexOf(',')+1);
      resolve(base64);
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function escHtml(s){
  return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ★ 2026-10-02新增：照片直接內嵌顯示。公司網路會連不到drive.google.com(檔案頁面/試算表)，
//   但googleusercontent.com連得到，所以從Drive網址取出檔案ID，圖片改走lh3.googleusercontent.com
//   直接顯示，點圖/非圖片檔改走drive.usercontent.google.com開啟，不再依賴Drive檔案頁面。
function driveFileId(url){
  const m = String(url||'').match(/\/d\/([\w-]+)|[?&]id=([\w-]+)/);
  return m ? (m[1]||m[2]) : '';
}
function evidenceViewUrl(url){
  const id = driveFileId(url);
  return id ? 'https://drive.usercontent.google.com/download?id=' + id + '&export=view' : String(url||'');
}
function evidenceHtml(url){
  if(!url) return '';
  const id = driveFileId(url);
  const view = escHtml(evidenceViewUrl(url));
  if(!id) return `<a href="${view}" target="_blank">查看檔案 →</a>`;
  return `<span><a href="${view}" target="_blank"><img class="evidence-img" src="https://lh3.googleusercontent.com/d/${escHtml(id)}" alt="現場照片"
      onerror="this.parentNode.parentNode.hidden=true;this.parentNode.parentNode.nextElementSibling.hidden=false;"></a></span><span hidden><a href="${view}" target="_blank">開啟檔案 →</a>（非圖片檔，無法預覽）</span>`;
}

// ★ 2026-09-23新增defectItems參數(不良項目：具體哪個尺寸量測項目不良/外觀哪個缺陷分類，
//   不只是尺寸NG/外觀不良這個大分類)，有值才多顯示一列，沒有就不顯示(舊單號可能沒這筆資料)。
// ★ 2026-09-30新增evidenceUrl參數：異常單填寫時附的現場照片，要在品保工程師/DRI
//   決定放行或駁回「之前」就看得到，不是等回應完才在摘要裡出現，所以補進這張待處理
//   畫面的事實表格，不是另外等結果畫面才顯示。
function renderFactsTable(t, defectItems, evidenceUrl){
  const isIQC = t.station === '進料';
  return `<table class="facts">
    ${t.station ? `<tr><td>站別</td><td>${escHtml(t.station)}</td></tr>` : ''}
    <tr><td>日期</td><td>${escHtml(t.date)}</td></tr>
    ${t.vendor ? `<tr><td>廠商</td><td>${escHtml(t.vendor)}</td></tr>` : ''}
    <tr><td>${isIQC ? '烘烤批' : (t.station === '射出' ? '機台' : '爐號')}</td><td>${escHtml(t.furnace)}</td></tr>
    <tr><td>${isIQC || t.station === '射出' ? '品名' : '模號'}</td><td>${escHtml(t.model)}</td></tr>
    <tr><td>工單號</td><td>${escHtml(t.wo)}</td></tr>
    <tr><td>判定</td><td>${escHtml(t.verdict)}</td></tr>
    ${defectItems ? `<tr><td>不良項目</td><td>${escHtml(defectItems)}</td></tr>` : ''}
    ${t.remark ? `<tr><td>開單備註</td><td>${escHtml(t.remark)}</td></tr>` : ''}
    ${evidenceUrl ? `<tr><td>現場照片</td><td>${evidenceHtml(evidenceUrl)}</td></tr>` : ''}
  </table>`;
}

async function init(){
  if(!ticketNo){
    app.innerHTML = `<h1>特採簽核</h1><div class="msg err">網址缺少單號參數(?ticket=...)，請確認連結是否正確。</div>`;
    return;
  }
  if(API_URL.indexOf('PASTE_')===0){
    app.innerHTML = `<h1>特採簽核</h1><div class="msg err">尚未設定API_URL，請先部署dri_response_backend.gs並填入網址。</div>`;
    return;
  }
  try{
    const res = await apiGet('getTicketStatus', {ticket: ticketNo});
    if(!res.ok){ app.innerHTML = `<h1>特採簽核</h1><div class="msg err">${escHtml(res.error)}</div>`; return; }
    render(res);
  }catch(err){
    app.innerHTML = `<h1>特採簽核</h1><div class="msg err">連線失敗：${escHtml(err.message)}</div>`;
  }
}

function render(data){
  if(data.status === '待DRI回應'){
    renderDriForm(data);
  }else if(data.status === '待品保工程師確認'){
    renderQAEngineerForm(data);
  }else if(data.status === '待品保主管審查'){
    renderQAManagerForm(data);
  }else if(data.status === '待技術審查'){
    renderTechReviewForm(data);
  }else if(data.status === '待大主管核准'){
    renderManagerForm(data);
  }else{
    renderReadonly(data);
  }
}

function renderReadonly(data){
  const isQA = data.defectType === '外觀不良';
  const who = data.mgrName || (isQA ? data.qaMgrName : data.driName) || '';
  const when = data.mgrTime || (isQA ? data.qaMgrTime : data.driTime) || '';
  // ★ 2026-09-23修改：尺寸NG路徑核准後的結果不再一定是「特採放行」，
  //   要依DRI原本判定(driChoice)顯示重工中/已報廢/特採放行；外觀不良路徑維持原樣。
  const nonQaApprovedResult = data.driChoice === '重工' ? '重工中' : (data.driChoice === '報廢' ? '已報廢' : '特採放行');
  const result = data.mgrChoice === '核准' ? (isQA ? '特採放行' : nonQaApprovedResult) : (isQA ? (data.qaEngChoice || '') : (data.driChoice || ''));
  app.innerHTML = `
    <h1>特採簽核</h1>
    <div class="ticket-no">${escHtml(data.ticketNo)}</div>
    ${renderFactsTable(data.ticket, data.defectItems, data.evidenceUrl)}
    <div class="readonly-box">
      此單已由 <b>${escHtml(who)}</b> 於 <b>${escHtml(when)}</b> 處理，
      目前狀態：<b>${escHtml(data.status)}</b>
      ${result ? `<br>結果：${escHtml(result)}` : ''}
      ${isQA ? `
        ${data.returnTarget ? `<br>退回對象：<b>${escHtml(data.returnTarget)}</b>` : ''}
        ${data.qaEngRemark ? `<br>放行理由/備註：${escHtml(data.qaEngRemark)}` : ''}
      ` : `
        ${data.batchQty ? `<br>批量/不良數：${escHtml(data.batchQty)} / ${escHtml(data.defectCount)}（不良率 ${escHtml(data.defectRate)}）` : ''}
        ${data.releaseCondition ? `<br>放行條件：${escHtml(data.releaseCondition)}` : ''}
        ${data.reworkProcess ? `<br>重工流程：${escHtml(data.reworkProcess)}` : ''}
        ${data.techReviewName ? `<br>技術審查：${escHtml(data.techReviewName)}（${escHtml(data.techReviewChoice)}，${escHtml(data.techReviewTime)}）` : ''}
      `}
      ${data.respEvidenceUrl ? `<br>佐證檔案：${evidenceHtml(data.respEvidenceUrl)}` : ''}
      ${data.mgrChoice ? `<br>大主管：${escHtml(data.mgrChoice)}` : ''}
    </div>
  `;
}

function renderDriForm(data){
  // ★ 2026-09-23補上：data.driChoice有值代表這是技術審查或大主管駁回後的重新回應
  // (前一次回應內容還留著，只是狀態被退回)，這次只能選重工/報廢，不能再選放行重送。
  const isRetryAfterReject = !!data.driChoice;
  app.innerHTML = `
    <h1>特採簽核 - DRI判定</h1>
    <div class="ticket-no">${escHtml(data.ticketNo)}</div>
    ${renderFactsTable(data.ticket, data.defectItems, data.evidenceUrl)}
    ${isRetryAfterReject ? `<div class="msg err" style="display:block;">此單先前放行後被駁回，這次只能選擇重工或報廢。</div>` : ''}
    <label>回應人姓名</label>
    <input type="text" id="f_name" placeholder="請輸入姓名(須與人員對照表一致)">
    <label>密碼</label>
    <input type="password" id="f_password" placeholder="個人密碼(初始為工號)">
    <label>判定</label>
    <div class="choice-row" id="choiceRow">
      ${isRetryAfterReject ? '' : `<button type="button" class="choice-btn" data-v="放行">放行</button>`}
      <button type="button" class="choice-btn" data-v="重工">重工</button>
      <button type="button" class="choice-btn" data-v="報廢">報廢</button>
    </div>
    <div class="release-condition" id="releaseBox">
      ${data.autoBatchQty ? `
        <label>批量／不良數（自動帶入，來源：${data.autoSource === '備註' ? '現場備註擷取，請核對' : '生產工站量測明細'}）</label>
        <div class="readonly-box" style="margin-bottom:8px;">批量：<b>${escHtml(data.autoBatchQty)}</b> 件　不良數：<b>${escHtml(data.autoDefectCount)}</b> 件　不良率：<b>${(data.autoDefectCount/data.autoBatchQty*100).toFixed(2)}%</b></div>
      ` : `
        <label>⚠️ 批量(必填)</label>
        <input type="number" id="f_batchQty" min="0" placeholder="這批總件數">
        <label>⚠️ 不良數(必填)</label>
        <input type="number" id="f_defectCount" min="0" placeholder="不良件數">
        <div class="small" id="defectRateHint" style="color:#888;font-size:12px;margin-top:4px;">不良率：--</div>
      `}
      <label>⚠️ 放行條件(必填)</label>
      <textarea id="f_condition" placeholder="請說明此次特採放行的判斷依據/條件"></textarea>
    </div>
    <div class="release-condition" id="reworkBox">
      <label>⚠️ 重工流程(必填)</label>
      <textarea id="f_reworkProcess" placeholder="請說明重工的方式/流程，也可以搭配下方上傳圖表輔助說明"></textarea>
    </div>
    <div class="release-condition" id="evidenceBox">
      <label>佐證檔案/流程圖表(選填，限1個檔案)</label>
      <input type="file" id="f_evidence">
    </div>
    <label>備註(選填)</label>
    <textarea id="f_remark"></textarea>
    <button class="submit-btn" id="submitBtn">送出</button>
    <div class="msg" id="msgBox"></div>
    <div style="text-align:center;margin-top:14px;"><a href="change-password.html" target="_blank" style="font-size:12px;color:#888;">忘記密碼／修改密碼</a></div>
  `;
  let choice = '';
  document.querySelectorAll('#choiceRow .choice-btn').forEach(btn=>{
    btn.onclick = ()=>{
      choice = btn.dataset.v;
      document.querySelectorAll('#choiceRow .choice-btn').forEach(b=>b.classList.toggle('sel', b===btn));
      document.getElementById('releaseBox').classList.toggle('show', choice==='放行');
      document.getElementById('reworkBox').classList.toggle('show', choice==='重工');
      document.getElementById('evidenceBox').classList.toggle('show', choice==='放行' || choice==='重工');
    };
  });
  if(!data.autoBatchQty){
    function updateDefectRateHint(){
      const b = Number(document.getElementById('f_batchQty').value);
      const d = Number(document.getElementById('f_defectCount').value);
      const hint = document.getElementById('defectRateHint');
      if(b > 0 && !isNaN(d)){
        hint.textContent = '不良率：' + (d / b * 100).toFixed(2) + '%';
      }else{
        hint.textContent = '不良率：--';
      }
    }
    document.getElementById('f_batchQty').addEventListener('input', updateDefectRateHint);
    document.getElementById('f_defectCount').addEventListener('input', updateDefectRateHint);
  }
  document.getElementById('submitBtn').onclick = async ()=>{
    const name = document.getElementById('f_name').value.trim();
    const password = document.getElementById('f_password').value;
    const condition = document.getElementById('f_condition').value.trim();
    const reworkProcess = document.getElementById('f_reworkProcess').value.trim();
    const batchQty = data.autoBatchQty ? String(data.autoBatchQty) : document.getElementById('f_batchQty').value.trim();
    const defectCount = data.autoBatchQty ? String(data.autoDefectCount) : document.getElementById('f_defectCount').value.trim();
    const remark = document.getElementById('f_remark').value.trim();
    const evidenceInput = document.getElementById('f_evidence');
    const evidenceFile = evidenceInput && evidenceInput.files[0];
    const msgBox = document.getElementById('msgBox');
    msgBox.className = 'msg';
    if(!name || !password){ msgBox.className='msg err'; msgBox.textContent='請輸入姓名和密碼'; return; }
    if(!choice){ msgBox.className='msg err'; msgBox.textContent='請選擇判定'; return; }
    if(choice==='放行' && !condition){ msgBox.className='msg err'; msgBox.textContent='選擇放行時必須填寫放行條件'; return; }
    if(choice==='放行' && (!batchQty || !defectCount)){ msgBox.className='msg err'; msgBox.textContent='選擇放行時必須填寫批量與不良數'; return; }
    if(choice==='放行' && Number(defectCount) > Number(batchQty)){ msgBox.className='msg err'; msgBox.textContent='不良數不能大於批量'; return; }
    if(choice==='重工' && !reworkProcess){ msgBox.className='msg err'; msgBox.textContent='選擇重工時必須填寫重工流程'; return; }
    document.getElementById('submitBtn').disabled = true;
    try{
      const payload = {ticketNo: data.ticketNo, name, password, choice, releaseCondition: condition, reworkProcess, batchQty, defectCount, remark};
      if(evidenceFile){
        payload.evidenceFileName = evidenceFile.name;
        payload.evidenceMimeType = evidenceFile.type;
        payload.evidenceFileBase64 = await readFileAsBase64(evidenceFile);
      }
      const res = await apiPost('driRespond', payload);
      if(res.ok){
        msgBox.className='msg ok'; msgBox.textContent='已送出，處理完成。';
        setTimeout(()=>init(), 1200);
      }else{
        msgBox.className='msg err'; msgBox.textContent=res.error;
        document.getElementById('submitBtn').disabled = false;
      }
    }catch(err){
      msgBox.className='msg err'; msgBox.textContent=(err.friendly ? err.message : '連線失敗：'+err.message);
      document.getElementById('submitBtn').disabled = false;
    }
  };
}

function renderManagerForm(data){
  const isQA = data.defectType === '外觀不良';
  const infoHtml = isQA ? `
      品保工程師：<b>${escHtml(data.qaEngName)}</b>（${escHtml(data.qaEngTime)}）<br>
      品保主管：<b>${escHtml(data.qaMgrName)}</b>（${escHtml(data.qaMgrTime)}）<br>
      放行理由：${escHtml(data.qaEngRemark)}<br>
      佐證檔案：${data.respEvidenceUrl ? `${evidenceHtml(data.respEvidenceUrl)}` : '（無）'}
    ` : `
      DRI：<b>${escHtml(data.driName)}</b>（${escHtml(data.driTime)}）<br>
      DRI判定：<b>${escHtml(data.driChoice)}</b><br>
      技術審查：<b>${escHtml(data.techReviewName)}</b>（${escHtml(data.techReviewTime)}）<br>
      ${data.driChoice === '放行' ? `批量/不良數：${escHtml(data.batchQty)} / ${escHtml(data.defectCount)}（不良率 ${escHtml(data.defectRate)}）<br>放行條件：${escHtml(data.releaseCondition)}<br>` : ''}
      ${data.driChoice === '重工' ? `重工流程：${escHtml(data.reworkProcess)}<br>` : ''}
      佐證檔案：${data.respEvidenceUrl ? `${evidenceHtml(data.respEvidenceUrl)}` : '（無）'}
      ${data.driRemark ? `<br>DRI備註：${escHtml(data.driRemark)}` : ''}
      ${data.techReviewRemark ? `<br>技術審查備註：${escHtml(data.techReviewRemark)}` : ''}
    `;
  app.innerHTML = `
    <h1>特採簽核 - 大主管核准</h1>
    <div class="ticket-no">${escHtml(data.ticketNo)}</div>
    ${renderFactsTable(data.ticket, data.defectItems, data.evidenceUrl)}
    <div class="readonly-box">${infoHtml}</div>
    <label>核准人姓名</label>
    <input type="text" id="f_name" placeholder="請輸入姓名(須與人員對照表一致)">
    <label>密碼</label>
    <input type="password" id="f_password" placeholder="個人密碼(初始為工號)">
    <label>核准結果</label>
    <div class="choice-row" id="choiceRow">
      <button type="button" class="choice-btn" data-v="核准">核准</button>
      <button type="button" class="choice-btn" data-v="駁回">駁回</button>
    </div>
    <label>備註(選填)</label>
    <textarea id="f_remark"></textarea>
    <button class="submit-btn" id="submitBtn">送出</button>
    <div class="msg" id="msgBox"></div>
    <div style="text-align:center;margin-top:14px;"><a href="change-password.html" target="_blank" style="font-size:12px;color:#888;">忘記密碼／修改密碼</a></div>
  `;
  let decision = '';
  document.querySelectorAll('#choiceRow .choice-btn').forEach(btn=>{
    btn.onclick = ()=>{
      decision = btn.dataset.v;
      document.querySelectorAll('#choiceRow .choice-btn').forEach(b=>b.classList.toggle('sel', b===btn));
    };
  });
  document.getElementById('submitBtn').onclick = async ()=>{
    const name = document.getElementById('f_name').value.trim();
    const password = document.getElementById('f_password').value;
    const remark = document.getElementById('f_remark').value.trim();
    const msgBox = document.getElementById('msgBox');
    msgBox.className = 'msg';

function renderQAEngineerForm(data){
  // ★ 2026-10-05補上(比照renderDriForm)：data.qaEngChoice有值代表品保主管或大主管駁回後的重新回應，
  // 這次只能選退回上一站，不能再選放行重送。
  const isRetryAfterReject = !!data.qaEngChoice;
  app.innerHTML = `
    <h1>特採簽核 - 品保工程師判定(外觀不良)</h1>
    <div class="ticket-no">${escHtml(data.ticketNo)}</div>
    ${renderFactsTable(data.ticket, data.defectItems, data.evidenceUrl)}
    ${isRetryAfterReject ? `<div class="msg err" style="display:block;">此單先前放行後被駁回，這次只能選擇退回上一站。</div>` : ''}
    <label>回應人姓名</label>
    <input type="text" id="f_name" placeholder="請輸入姓名(須與人員對照表一致)">
    <label>密碼</label>
    <input type="password" id="f_password" placeholder="個人密碼(初始為工號)">
    <label>判定</label>
    <div class="choice-row" id="choiceRow">
      ${isRetryAfterReject ? '' : `<button type="button" class="choice-btn" data-v="放行">放行</button>`}
      <button type="button" class="choice-btn" data-v="退回上一站">退回上一站</button>
    </div>
    <div class="release-condition" id="releaseBox">
      <label>⚠️ 放行理由(必填)</label>
      <textarea id="f_remark_release" placeholder="請說明此次特採放行的判斷依據/理由"></textarea>
      <label>佐證檔案(選填，限1個檔案)</label>
      <input type="file" id="f_evidence">
    </div>
    <div class="release-condition" id="backBox">
      <label>⚠️ 退回對象(必填)</label>
      <div class="choice-row" id="targetRow">
        <button type="button" class="choice-btn" data-t="廠商">廠商</button>
        <button type="button" class="choice-btn" data-t="廠內">廠內</button>
      </div>
      <input type="text" id="f_target" placeholder="請先選擇廠商或廠內" style="margin-top:8px;">
      <label>備註(選填)</label>
      <textarea id="f_remark_back" placeholder="可說明退回原因"></textarea>
    </div>
    <button class="submit-btn" id="submitBtn">送出</button>
    <div class="msg" id="msgBox"></div>
    <div style="text-align:center;margin-top:14px;"><a href="change-password.html" target="_blank" style="font-size:12px;color:#888;">忘記密碼／修改密碼</a></div>
  `;
  let choice = '';
  document.querySelectorAll('#choiceRow .choice-btn').forEach(btn=>{
    btn.onclick = ()=>{
      choice = btn.dataset.v;
      document.querySelectorAll('#choiceRow .choice-btn').forEach(b=>b.classList.toggle('sel', b===btn));
      document.getElementById('releaseBox').classList.toggle('show', choice==='放行');
      document.getElementById('backBox').classList.toggle('show', choice==='退回上一站');
    };
  });
  // ★ 2026-10-06新增：退回上一站要指定退回對象。選「廠商」時自動帶入單據上的廠商(可改)
  let targetType = '';
  document.querySelectorAll('#targetRow .choice-btn').forEach(btn=>{
    btn.onclick = ()=>{
      targetType = btn.dataset.t;
      document.querySelectorAll('#targetRow .choice-btn').forEach(b=>b.classList.toggle('sel', b===btn));
      const inp = document.getElementById('f_target');
      inp.placeholder = targetType==='廠商' ? '廠商名稱，例如：博皓' : '退回的站別／單位，例如：整形、三廠';
      inp.value = targetType==='廠商' ? ((data.ticket && data.ticket.vendor) || '') : '';
      inp.focus();
    };
  });
  document.getElementById('submitBtn').onclick = async ()=>{
    const name = document.getElementById('f_name').value.trim();
    const password = document.getElementById('f_password').value;
    const msgBox = document.getElementById('msgBox');
    msgBox.className = 'msg';
    if(!name || !password){ msgBox.className='msg err'; msgBox.textContent='請輸入姓名和密碼'; return; }
    if(!choice){ msgBox.className='msg err'; msgBox.textContent='請選擇判定'; return; }
    const remark = choice==='放行'
      ? document.getElementById('f_remark_release').value.trim()
      : document.getElementById('f_remark_back').value.trim();
    if(choice==='放行' && !remark){ msgBox.className='msg err'; msgBox.textContent='選擇放行時必須填寫放行理由'; return; }
    const targetName = document.getElementById('f_target').value.trim();
    if(choice==='退回上一站' && (!targetType || !targetName)){ msgBox.className='msg err'; msgBox.textContent='請選擇退回對象(廠商／廠內)並填寫名稱'; return; }
    const evidenceInput = document.getElementById('f_evidence');
    const evidenceFile = evidenceInput && evidenceInput.files[0];
    document.getElementById('submitBtn').disabled = true;
    try{
      const payload = {ticketNo: data.ticketNo, name, password, choice, remark};
      if(choice==='退回上一站') payload.returnTarget = targetType + '：' + targetName;
      if(choice==='放行' && evidenceFile){
        payload.evidenceFileName = evidenceFile.name;
        payload.evidenceMimeType = evidenceFile.type;
        payload.evidenceFileBase64 = await readFileAsBase64(evidenceFile);
      }
      const res = await apiPost('qaEngineerRespond', payload);
      if(res.ok){
        msgBox.className='msg ok'; msgBox.textContent='已送出，處理完成。';
        setTimeout(()=>init(), 1200);
      }else{
        msgBox.className='msg err'; msgBox.textContent=res.error;
        document.getElementById('submitBtn').disabled = false;
      }
    }catch(err){
      msgBox.className='msg err'; msgBox.textContent=(err.friendly ? err.message : '連線失敗：'+err.message);
      document.getElementById('submitBtn').disabled = false;
    }
  };
}
