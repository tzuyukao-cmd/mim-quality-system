<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>修改密碼 - 特採簽核</title>
<style>
  body{font-family:"Microsoft JhengHei",sans-serif;background:#f4f5f7;margin:0;padding:20px;color:#222;}
  .card{max-width:420px;margin:0 auto;background:#fff;border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,.08);padding:24px;}
  h1{font-size:20px;margin:0 0 16px;}
  label{display:block;font-size:13px;color:#555;margin:12px 0 4px;font-weight:600;}
  input[type=text],input[type=password]{width:100%;box-sizing:border-box;padding:8px;border:1px solid #ccc;border-radius:6px;font-size:14px;}
  .submit-btn{margin-top:18px;width:100%;padding:12px;background:#2563eb;color:#fff;border:none;border-radius:6px;font-size:15px;font-weight:700;cursor:pointer;}
  .submit-btn:disabled{background:#aaa;cursor:not-allowed;}
  .msg{margin-top:12px;padding:10px;border-radius:6px;font-size:13px;display:none;}
  .msg.err{background:#fdecea;color:#c0392b;display:block;}
  .msg.ok{background:#e6f6ec;color:#1e7e34;display:block;}
</style>
</head>
<body>
<div class="card">
  <h1>🔑 修改密碼</h1>
  <label>姓名</label>
  <input type="text" id="f_name" placeholder="請輸入姓名(須與人員對照表一致)">
  <label>目前密碼</label>
  <input type="password" id="f_old" placeholder="目前使用的密碼">
  <label>新密碼</label>
  <input type="password" id="f_new1" placeholder="至少4碼">
  <label>再輸入一次新密碼</label>
  <input type="password" id="f_new2" placeholder="確認新密碼">
  <button class="submit-btn" id="submitBtn">送出</button>
  <div class="msg" id="msgBox"></div>
</div>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbxWZB8U3HaU7m9TZsQ85PzRCvFJf8zIt3dd8WppQdu6XuPLwcKku-bCIzbE4v7qVP3Z/exec';

document.getElementById('submitBtn').onclick = async ()=>{
  const name = document.getElementById('f_name').value.trim();
  const oldPassword = document.getElementById('f_old').value;
  const newPassword = document.getElementById('f_new1').value;
  const newPassword2 = document.getElementById('f_new2').value;
  const msgBox = document.getElementById('msgBox');
  msgBox.className = 'msg';
  if(!name || !oldPassword || !newPassword){ msgBox.className='msg err'; msgBox.textContent='請完整填寫所有欄位'; return; }
  if(newPassword.length < 4){ msgBox.className='msg err'; msgBox.textContent='新密碼至少要4碼'; return; }
  if(newPassword !== newPassword2){ msgBox.className='msg err'; msgBox.textContent='兩次輸入的新密碼不一致'; return; }
  document.getElementById('submitBtn').disabled = true;
  try{
    const res = await fetch(API_URL, {
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({action:'changePassword', payload:{name, oldPassword, newPassword}})
    });
    const data = await res.json();
    if(data.ok){
      msgBox.className='msg ok'; msgBox.textContent='密碼已更新成功，請記住新密碼。';
      document.getElementById('f_old').value='';
      document.getElementById('f_new1').value='';
      document.getElementById('f_new2').value='';
    }else{
      msgBox.className='msg err'; msgBox.textContent=data.error;
    }
  }catch(err){
    msgBox.className='msg err'; msgBox.textContent='連線失敗：'+err.message;
  }
  document.getElementById('submitBtn').disabled = false;
};
</script>
</body>
</html>
